stroke="#64748b" fill="none" marker-end="url(#a)"/><path d="M1015 452 L1015 495" stroke="#64748b" fill="none" marker-end="url(#a)"/><path d="M1015 547 L820 650" stroke="#64748b" fill="none" marker-end="url(#a)"/><path d="M465 547 L300 650" stroke="#64748b" fill="none" marker-end="url(#a)"/><rect x="60" y="60" width="1000" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="560.0" y="91" text-anchor="middle">UI: public/index.html + js/app.js + css/style.css</text><rect x="60" y="150" width="1000" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="560.0" y="181" text-anchor="middle">server.js — Express static files, /api, /orders/:id/invoice</text><rect x="35" y="260" width="255" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="162.5" y="291" text-anchor="middle">routes/products.js</text><rect x="310" y="260" width="255" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="437.5" y="291" text-anchor="middle">routes/orders.js</text><rect x="585" y="260" width="255" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="712.5" y="291" text-anchor="middle">routes/customers.js</text><rect x="860" y="260" width="255" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="987.5" y="291" text-anchor="middle">routes/reports.js</text><rect x="35" y="400" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="135.0" y="431" text-anchor="middle">lib/inventory.js</text><rect x="255" y="400" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="355.0" y="431" text-anchor="middle">lib/coupons.js</text><rect x="475" y="400" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="575.0" y="431" text-anchor="middle">lib/pricing.js</text><rect x="695" y="400" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="795.0" y="431" text-anchor="middle">lib/tax.js</text><rect x="915" y="400" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="1015.0" y="431" text-anchor="middle">lib/orders.js</text><rect x="35" y="495" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="135.0" y="526" text-anchor="middle">lib/ledger.js</text><rect x="255" y="495" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="355.0" y="526" text-anchor="middle">lib/dates.js</text><rect x="475" y="495" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="575.0" y="526" text-anchor="middle">lib/invoice.js</text><rect x="695" y="495" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="795.0" y="526" text-anchor="middle">lib/reports.js</text><rect x="915" y="495" width="200" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="1015.0" y="526" text-anchor="middle">lib/store.js</text><rect x="60" y="650" width="480" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="300.0" y="681" text-anchor="middle">config.js — shop, coupons, HSN GST settings</text><rect x="580" y="650" width="480" height="52" rx="6" fill="white" stroke="#94a3b8"/><text x="820.0" y="681" text-anchor="middle">data/db.json — products, orders, customers, audit</text><text x="35" y="605">Connections above group router/domain layers; exact calls and placement flow below.</text><text x="35" y="760">Place order: UI ? routes/orders ? store.read ? inventory.find/check ? coupons.validate</text><text x="35" y="793">? pricing.computeTotals (coupons + tax) ? ledger.chargeOrderToKhata (credit only)</text><text x="35" y="826">? inventory.reserve ? orders.add (dates.today) ? store.appendAudit/write ? JSON response</text><text x="35" y="865">Invoice: server ? orders.get + store.read ? invoice ? pricing (after fix) ? HTML</text><text x="35" y="900">Reports ? inventory + ledger + invoice; customers ? ledger; products ? inventory + tax + coupons.</text></svg>